workflows:
  nova-os-android:
    name: Nova OS Android Build
    max_build_duration: 60

    environment:
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.nova.os"

      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Set permissions
        script: chmod +x gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
